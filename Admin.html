<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-Панель | Управление Орденом</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0b0e14; color: #e1e6f0; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 950px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    h1 { color: #ffc107; font-size: 24px; text-transform: uppercase; letter-spacing: 1.5px; }
    .nav-btns { display: flex; gap: 10px; }
    .btn-nav { padding: 8px 14px; background: #161a23; color: #4ecdc4; text-decoration: none; border: 1px solid #4ecdc4; border-radius: 6px; font-weight: bold; font-size: 12px; text-transform: uppercase; transition: 0.2s; }
    .btn-nav:hover { background: rgba(78, 205, 196, 0.1); }

    .stats-bar { display: flex; justify-content: space-between; align-items: center; background: #161a23; border: 1px solid #282e3e; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    .stat-info { font-size: 14px; color: #8e95a5; }
    .stat-info strong { color: #fff; font-size: 16px; }

    .btn-danger-all { padding: 8px 14px; background: rgba(255, 70, 85, 0.2); color: #ff4655; border: 1px solid #ff4655; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
    .btn-danger-all:hover { background: #ff4655; color: #fff; }

    .table-responsive { background: #161a23; border-radius: 10px; border: 1px solid #282e3e; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
    th { background: #0f131a; padding: 14px 16px; color: #8e95a5; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #282e3e; }
    td { padding: 14px 16px; border-bottom: 1px solid #1c2230; font-size: 14px; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #1a202c; }

    .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-primarch { background: rgba(255, 70, 85, 0.2); color: #ff4655; border: 1px solid #ff4655; }
    .badge-officer { background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid #ffc107; }
    .badge-brother { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; border: 1px solid #4ecdc4; }
    .badge-neophyte { background: rgba(142, 149, 165, 0.2); color: #8e95a5; border: 1px solid #8e95a5; }

    .nick-sub { display: block; font-size: 11px; color: #718096; margin-top: 2px; }

    .actions { display: flex; gap: 8px; }
    .btn-action { padding: 6px 10px; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-edit { background: #ffc107; color: #000; }
    .btn-edit:hover { background: #e0a800; }
    .btn-delete { background: #ff4655; color: #fff; }
    .btn-delete:hover { background: #d63031; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Панель Администратора</h1>
      <div class="nav-btns">
        <a href="members.html" class="btn-nav">Состав Ордена</a>
        <a href="index.html" class="btn-nav">Анкета</a>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-info">Всего участников в базе: <strong id="totalCount">0</strong></div>
      <button class="btn-danger-all" onclick="clearAll()">Сбросить всю базу</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Игрок</th>
            <th>Звание WH40K</th>
            <th>Скилл</th>
            <th>Убийства</th>
            <th>Контакт</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="adminList">
          <!-- Загрузка из localStorage -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function getBadgeClass(rank) {
      if (rank === 'Примарх') return 'badge-primarch';
      if (['Магистр Ордена', 'Капитан'].includes(rank)) return 'badge-officer';
      if (['Неофит'].includes(rank)) return 'badge-neophyte';
      return 'badge-brother';
    }

    function renderAdminTable() {
      let members = JSON.parse(localStorage.getItem('wh_members')) || [];
      const tbody = document.getElementById('adminList');
      tbody.innerHTML = '';

      if (members.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px; color: #8e95a5;">База данных пуста. Заявок нет.</td></tr>';
        document.getElementById('totalCount').innerText = '0';
        return;
      }

      members.forEach((m, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <strong>${m.currentNick}</strong>
            <span class="nick-sub">Коренной: ${m.mainNick}</span>
          </td>
          <td><span class="badge ${getBadgeClass(m.whRank)}">${m.whRank}</span></td>
          <td>${m.skill} / 10</td>
          <td>${(Number(m.kills) || 0).toLocaleString()}</td>
          <td>${m.contact}</td>
          <td>
            <div class="actions">
              <button class="btn-action btn-edit" onclick="editRank(${index})">Звание</button>
              <button class="btn-action btn-delete" onclick="deleteMember(${index})">Удалить</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('totalCount').innerText = members.length;
    }

    function deleteMember(index) {
      if (confirm('Вы уверены, что хотите удалить этого бойца из Ордена?')) {
        let members = JSON.parse(localStorage.getItem('wh_members')) || [];
        members.splice(index, 1);
        localStorage.setItem('wh_members', JSON.stringify(members));
        renderAdminTable();
      }
    }

    function editRank(index) {
      let members = JSON.parse(localStorage.getItem('wh_members')) || [];
      const newRank = prompt('Введите новое звание (например: Капитан, Боевой Брат, Неофит):', members[index].whRank);
      if (newRank && newRank.trim() !== '') {
        members[index].whRank = newRank.trim();
        localStorage.setItem('wh_members', JSON.stringify(members));
        renderAdminTable();
      }
    }

    function clearAll() {
      if (confirm('ВНИМАНИЕ: Это полностью очистит базу данных и удалит всех участников! Вы уверены?')) {
        localStorage.removeItem('wh_members');
        renderAdminTable();
      }
    }

    renderAdminTable();
  </script>

</body>
</html>
