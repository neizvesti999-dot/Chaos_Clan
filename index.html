<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Clan | Warhammer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0d0e12;
      color: #e1e4ed;
      padding: 15px;
      line-height: 1.5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid #8b0000;
      margin-bottom: 20px;
    }

    header h1 {
      color: #ff3333;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
    }

    header p {
      color: #8a8f9e;
      font-size: 13px;
      margin-top: 5px;
    }

    /* Навигация / Вкладки */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #161922;
      border: 1px solid #2a2e3d;
      color: #a0a5b5;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #8b0000;
      color: #fff;
      border-color: #ff3333;
      box-shadow: 0 0 10px rgba(139, 0, 0, 0.4);
    }

    .tab-content {
      display: none;
      background: #141720;
      border: 1px solid #252936;
      border-radius: 10px;
      padding: 20px;
    }

    .tab-content.active {
      display: block;
    }

    /* Карточки статистики */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #1c202c;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid #ff3333;
      text-align: center;
    }

    .stat-card .value {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }

    .stat-card .label {
      font-size: 11px;
      color: #8a8f9e;
      margin-top: 4px;
    }

    /* Таблица */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #252936;
    }

    th {
      background: #1c202c;
      color: #8a8f9e;
      font-weight: 600;
    }

    .nick-sub {
      display: block;
      font-size: 11px;
      color: #727785;
    }

    /* Значки рангов */
    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-primarch { background: #d4af37; color: #000; }
    .badge-officer { background: #8b0000; color: #fff; }
    .badge-brother { background: #2a344d; color: #a5c2ff; }
    .badge-neophyte { background: #3d3d3d; color: #ccc; }

    /* Форма */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #a0a5b5;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: #1c202c;
      border: 1px solid #2e3445;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #ff3333;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b0000, #ff3333);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 51, 51, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⚔️ CHAOS CLAN ⚔️</h1>
      <p>Официальный портал клана</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('rosterTab', this)">Состав клана</button>
      <button class="tab-btn" onclick="switchTab('applyTab', this)">Подать заявку</button>
    </div>

    <!-- Вкладка: Состав -->
    <div id="rosterTab" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="value" id="totalCount">0</div>
          <div class="label">Всего бойцов</div>
        </div>
        <div class="stat-card">
          <div class="value" id="totalKills">0</div>
          <div class="label">Всего убийств</div>
        </div>
        <div class="stat-card">
          <div class="value" id="avgSkill">0 / 10</div>
          <div class="label">Средний скилл</div>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Боец</th>
              <th>Звание</th>
              <th>Скилл</th>
              <th>Онлайн</th>
              <th>Убийства</th>
              <th>Связь</th>
            </tr>
          </thead>
          <tbody id="membersList">
            <!-- Загружается из JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Вкладка: Заявка -->
    <div id="applyTab" class="tab-content">
      <form id="clanForm">
        <div class="form-group">
          <label>Изначальный (коренной) ник:</label>
          <input type="text" id="mainNick" placeholder="Например: Player1" required>
        </div>

        <div class="form-group">
          <label>Текущий ник в игре:</label>
          <input type="text" id="currentNick" placeholder="Например: [Chaos] Player1" required>
        </div>

        <div class="form-group">
          <label>Возраст:</label>
          <input type="number" id="age" min="10" max="99" placeholder="16" required>
        </div>

        <div class="form-group">
          <label>Звание / Должность:</label>
          <select id="whRank">
            <option value="Неофит">Неофит</option>
            <option value="Брат">Брат</option>
            <option value="Капитан">Капитан</option>
            <option value="Магистр Ордена">Магистр Ордена</option>
            <option value="Примарх">Примарх</option>
          </select>
        </div>

        <div class="form-group">
          <label>Оценка онлайна (от 1 до 10):</label>
          <input type="number" id="online" min="1" max="10" placeholder="8" required>
        </div>

        <div class="form-group">
          <label>Оценка скилла (от 1 до 10):</label>
          <input type="number" id="skill" min="1" max="10" placeholder="7" required>
        </div>

        <div class="form-group">
          <label>Количество убийств (Kills):</label>
          <input type="number" id="kills" placeholder="1500" required>
        </div>

        <div class="form-group">
          <label>Контакт для связи (Telegram / Discord):</label>
          <input type="text" id="contact" placeholder="@username" required>
        </div>

        <button type="submit" class="btn-submit">ОТПРАВИТЬ ЗАЯВКУ</button>
      </form>
    </div>
  </div>

  <script>
    const TELEGRAM_TOKEN = '8947448196:AAFWHsgbL42vG-G48kbV4RT6P3SL7xRjHEg';
    const TELEGRAM_CHAT_ID = '8777947306';

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function getBadgeClass(rank) {
      if (rank === 'Примарх') return 'badge-primarch';
      if (['Магистр Ордена', 'Капитан'].includes(rank)) return 'badge-officer';
      if (['Неофит'].includes(rank)) return 'badge-neophyte';
      return 'badge-brother';
    }

    function renderMembers() {
      let members = JSON.parse(localStorage.getItem('wh_members')) || [];
      const tbody = document.getElementById('membersList');
      tbody.innerHTML = '';

      let totalKills = 0;
      let totalSkill = 0;

      if (members.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#8a8f9e; padding:20px;">Список бойцов пуст. Заполните заявку!</td></tr>';
      } else {
        members.forEach(m => {
          totalKills += Number(m.kills) || 0;
          totalSkill += Number(m.skill) || 0;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <strong>${m.currentNick}</strong>
              <span class="nick-sub">Коренной: ${m.mainNick}</span>
            </td>
            <td><span class="badge ${getBadgeClass(m.whRank)}">${m.whRank}</span></td>
            <td>${m.skill} / 10</td>
            <td>${m.online} / 10</td>
            <td>${(Number(m.kills) || 0).toLocaleString()}</td>
            <td>${m.contact}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('totalCount').innerText = members.length;
      document.getElementById('totalKills').innerText = totalKills.toLocaleString();
      document.getElementById('avgSkill').innerText = (members.length ? (totalSkill / members.length).toFixed(1) : 0) + ' / 10';
    }

    document.getElementById('clanForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const mainNick = document.getElementById('mainNick').value;
      const currentNick = document.getElementById('currentNick').value;
      const age = document.getElementById('age').value;
      const whRank = document.getElementById('whRank').value;
      const online = document.getElementById('online').value;
      const skill = document.getElementById('skill').value;
      const kills = document.getElementById('kills').value;
      const contact = document.getElementById('contact').value;

      const textMessage = 
        `⚔️ <b>НОВАЯ ЗАЯВКА В КЛАН</b>\n\n` +
        `👤 <b>Ник:</b> ${currentNick} (Основной: ${mainNick})\n` +
        `🔞 <b>Возраст:</b> ${age}\n` +
        `🎖 <b>Звание:</b> ${whRank}\n` +
        `🎯 <b>Скилл:</b> ${skill}/10 | <b>Онлайн:</b> ${online}/10\n` +
        `💀 <b>Убийств:</b> ${kills}\n` +
        `📱 <b>Контакт:</b> ${contact}`;

      fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: textMessage,
          parse_mode: 'HTML'
        })
      })
      .then(response => {
        if (response.ok) {
          alert('Заявка успешно отправлена в Telegram!');
          
          let members = JSON.parse(localStorage.getItem('wh_members')) || [];
          members.push({ mainNick, currentNick, age, whRank, online, skill, kills, contact });
          localStorage.setItem('wh_members', JSON.stringify(members));
          renderMembers();

          this.reset();
        } else {
          alert('Ошибка отправки. Убедитесь, что вы нажали /start в боте @anketa_chaos_bot');
        }
      })
      .catch(() => alert('Ошибка сети при отправке.'));
    });

    renderMembers();
  </script>
</body>
</html>
