<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление и Повышения | Админ-Панель</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0b0e14; color: #e1e6f0; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 950px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; border-bottom: 2px solid #282e3e; padding-bottom: 15px; }
    h1 { color: #ffc107; font-size: 22px; text-transform: uppercase; letter-spacing: 1.5px; }
    .btn-main { padding: 8px 16px; background: #ff4655; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 13px; text-transform: uppercase; transition: 0.2s; }
    .btn-main:hover { background: #e03e4d; }

    .log-box { background: #161a23; border: 1px solid #4ecdc4; color: #4ecdc4; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; display: none; }

    .search-box { margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 12px; background: #161a23; border: 1px solid #282e3e; border-radius: 8px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
    .search-box input:focus { border-color: #ffc107; }

    .table-responsive { background: #161a23; border-radius: 10px; border: 1px solid #282e3e; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; min-width: 750px; }
    th { background: #0f131a; padding: 14px 16px; color: #8e95a5; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #282e3e; }
    td { padding: 14px 16px; border-bottom: 1px solid #1c2230; font-size: 14px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #1a202c; }

    .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-primarch { background: rgba(255, 70, 85, 0.2); color: #ff4655; border: 1px solid #ff4655; }
    .badge-officer { background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid #ffc107; }
    .badge-brother { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; border: 1px solid #4ecdc4; }
    .badge-neophyte { background: rgba(142, 149, 165, 0.2); color: #8e95a5; border: 1px solid #8e95a5; }

    .nick-sub { display: block; font-size: 11px; color: #718096; margin-top: 2px; }

    .promo-actions { display: flex; gap: 6px; align-items: center; }
    .btn-promo { padding: 6px 10px; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-up { background: #2ed573; color: #000; }
    .btn-up:hover { background: #26af5f; }
    .btn-down { background: #ff4757; color: #fff; }
    .btn-down:hover { background: #d63031; }

    select.rank-select { padding: 6px; background: #0b0e14; border: 1px solid #282e3e; color: #fff; border-radius: 4px; font-size: 12px; outline: none; cursor: pointer; }
    select.rank-select:focus { border-color: #ffc107; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Панель Промоутов и Званий</h1>
      <a href="index.html" class="btn-main">← На главную</a>
    </div>

    <div class="log-box" id="logBox"></div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск бойца для повышения..." onkeyup="filterTable()">
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Воин</th>
            <th>Текущее Звание</th>
            <th>Быстрый Промоут</th>
            <th>Назначить Звание</th>
            <th>Контакт</th>
          </tr>
        </thead>
        <tbody id="promoList">
          <!-- Загрузка данных -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Иерархия званий от младшего к старшему
    const ranksOrder = [
      'Неофит',
      'Боевой Брат',
      'Ветеран',
      'Аптекарь',
      'Технодесантник',
      'Капеллан',
      'Библиарий',
      'Капитан',
      'Магистр Ордена',
      'Примарх'
    ];

    function getBadgeClass(rank) {
      if (rank === 'Примарх') return 'badge-primarch';
      if (['Магистр Ордена', 'Капитан'].includes(rank)) return 'badge-officer';
      if (['Неофит'].includes(rank)) return 'badge-neophyte';
      return 'badge-brother';
    }

    function showLog(text) {
      const logBox = document.getElementById('logBox');
      logBox.innerText = '⚡ ' + text;
      logBox.style.display = 'block';
    }

    function renderPromoTable() {
      let members = JSON.parse(localStorage.getItem('wh_members')) || [];
      const tbody = document.getElementById('promoList');
      tbody.innerHTML = '';

      if (members.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: #8e95a5;">Список воинов пуст.</td></tr>';
        return;
      }

      members.forEach((m, index) => {
        const tr = document.createElement('tr');
        
        // Генерация options для выбора звания
        let selectOptions = ranksOrder.map(r => 
          `<option value="${r}" ${r === m.whRank ? 'selected' : ''}>${r}</option>`
        ).join('');

        tr.innerHTML = `
          <td>
            <strong>${m.currentNick}</strong>
            <span class="nick-sub">Коренной: ${m.mainNick}</span>
          </td>
          <td><span class="badge ${getBadgeClass(m.whRank)}">${m.whRank}</span></td>
          <td>
            <div class="promo-actions">
              <button class="btn-promo btn-up" onclick="changeRankStep(${index}, 1)" title="Повысить">▲ Повысить</button>
              <button class="btn-promo btn-down" onclick="changeRankStep(${index}, -1)" title="Понизить">▼ Понизить</button>
            </div>
          </td>
          <td>
            <select class="rank-select" onchange="setRankDirect(${index}, this.value)">
              ${selectOptions}
            </select>
          </td>
          <td>${m.contact}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function changeRankStep(index, direction) {
      let members = JSON.parse(localStorage.getItem('wh_members')) || [];
      let currentRank = members[index].whRank;
      let currentIndex = ranksOrder.indexOf(currentRank);

      if (currentIndex === -1) currentIndex = 0; // если звание не из списка

      let newIndex = currentIndex + direction;

      if (newIndex >= ranksOrder.length) {
        alert('Боец уже достиг максимального звания (Примарх)!');
        return;
      }
      if (newIndex < 0) {
        alert('Боец уже находится на самом низком звании (Неофит)!');
        return;
      }

      let oldRank = members[index].whRank;
      members[index].whRank = ranksOrder[newIndex];
      localStorage.setItem('wh_members', JSON.stringify(members));

      showLog(`Игрок ${members[index].currentNick}: ${oldRank} → ${members[index].whRank}`);
      renderPromoTable();
    }

    function setRankDirect(index, newRank) {
      let members = JSON.parse(localStorage.getItem('wh_members')) || [];
      let oldRank = members[index].whRank;
      members[index].whRank = newRank;
      localStorage.setItem('wh_members', JSON.stringify(members));

      showLog(`Звание игрока ${members[index].currentNick} изменено: ${oldRank} → ${newRank}`);
      renderPromoTable();
    }

    function filterTable() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#promoList tr");

      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
      });
    }

    renderPromoTable();
  </script>

</body>
</html>
